<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Justificantes - Área TI | Actualizar Contraseña</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="actualizar-contrasena.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark custom-navbar-bg fixed-top">
        <div class="container-fluid">
            <a class="navbar-brand me-4" href="#">
                <img src="/src/app/componentes/images/LogoUtng.png" alt="Logo Universidad" height="50">
            </a>
            <div class="d-flex flex-column text-white">
                <h1 class="fs-4 mb-0">SISTEMA DE JUSTIFICANTES</h1>
                <h2 class="fs-5 mb-0">- ÁREA TI</h2>
            </div>
            <div class="ms-auto d-flex align-items-center">
                <div class="dropdown">
                    <span class="text-white me-2">User Name</span>
                    
                    <button class="btn dropdown-toggle p-0" type="button" data-bs-toggle="dropdown" aria-expanded="false" id="userDropdown">
                        <i class="bi bi-person-circle fs-2 custom-user-icon"></i>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userDropdown">
                        <li><a class="dropdown-item" href="/src/app/componentes/perfil/vista-general/vista-general.html">Perfil</a></li>
                        <li><a class="dropdown-item" href="/src/app/componentes/inicio-sesion/inicio-sesion.html">Cerrar Sesión</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>

    <div class="custom-purple-bar mt-5">
        <div class="dropdown">
            <button class="custom-link-dropdown dropdown-toggle" type="button" data-bs-toggle="dropdown">
                <i class="bi bi-chevron-down-fill me-2"></i> Procesos
            </button>
            <ul class="dropdown-menu">
                <li><a class="dropdown-item" href="/src/app/componentes/home/home.html">Menú</a></li>
                <li><a class="dropdown-item" href="#">Proceso 1</a></li>
                <li><a class="dropdown-item" href="#">Proceso 2</a></li>
                <li><a class="dropdown-item" href="#">Proceso 3</a></li>
                <li><a class="dropdown-item" href="#">Proceso 4</a></li>
                <li><a class="dropdown-item active" href="/src/app/componentes/perfil/actualizar-contrasena/actualizar-contrasena.html">Actualizar Contraseña</a></li>
            </ul>
        </div>
    </div>

    <div class="active-option-bar">
        Actualizar Contraseña
    </div>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-5">
                <div class="card shadow-sm p-4">
                    <h5 class="mb-4 text-center">Actualizar Contraseña</h5>
                    
                    <form id="updatePasswordForm">
                        <div class="mb-3">
                            <label for="currentPassword" class="form-label">Contraseña Actual:</label>
                            <input type="password" class="form-control" id="currentPassword" placeholder="Ingrese su contraseña actual" required>
                        </div>
                        <div class="mb-3">
                            <label for="newPassword" class="form-label">Nueva Contraseña:</label>
                            <input type="password" class="form-control" id="newPassword" placeholder="Ingrese su nueva contraseña" required>
                        </div>
                        <div class="mb-3">
                            <label for="confirmPassword" class="form-label">Confirmar Nueva Contraseña:</label>
                            <input type="password" class="form-control" id="confirmPassword" placeholder="Confirme su nueva contraseña" required>
                        </div>
                        <button type="submit" class="btn custom-btn-actualizar w-100 mt-3">Actualizar Contraseña</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="passwordUpdatedModal" tabindex="-1" aria-labelledby="passwordUpdatedModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-success text-white">
                    <h5 class="modal-title" id="passwordUpdatedModalLabel">Contraseña Actualizada</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body text-center">
                    <i class="bi bi-check-circle-fill text-success fs-1 mb-3"></i>
                    <p>Su contraseña se ha actualizado correctamente.</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn custom-btn-actualizar" data-bs-dismiss="modal" type="button" onClick="location.href='/src/app/componentes/perfil/datos-personales/datos-personales.html'">Aceptar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('updatePasswordForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const current = document.getElementById('currentPassword').value.trim();
            const newPass = document.getElementById('newPassword').value.trim();
            const confirm = document.getElementById('confirmPassword').value.trim();

            if (!current || !newPass || !confirm) {
                alert('Por favor, complete todos los campos.');
                return;
            }

            if (newPass !== confirm) {
                alert('Las contraseñas nuevas no coinciden.');
                return;
            }

            const modal = new bootstrap.Modal(document.getElementById('passwordUpdatedModal'));
            modal.show();


            this.reset();
        });
    </script>

</body>
</html>
