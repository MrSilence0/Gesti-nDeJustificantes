<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Justificantes - Solicitar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="solicitar-justificante.css">
</head>
<body>

<!-- NAVBAR PRINCIPAL -->
<nav class="navbar navbar-expand-lg navbar-dark custom-navbar-bg fixed-top">
    <div class="container-fluid">
        <a class="navbar-brand me-4" href="#">
            <img src="Universidad_Tecnológica_del_Norte_de_Guanajuato_(UTNG).png" alt="Logo Universidad" height="50">
        </a>

        <div class="d-flex flex-column text-white">
            <h1 class="fs-4 mb-0">SISTEMA DE JUSTIFICANTES</h1>
            <h2 class="fs-5 mb-0">- ÁREA TI</h2>
        </div>

        <div class="ms-auto d-flex align-items-center">
            <div class="dropdown">
                <span class="text-white me-2" id="userName">Estudiante01</span>
                <button class="btn dropdown-toggle p-0" type="button" data-bs-toggle="dropdown">
                    <i class="bi bi-person-circle fs-2 custom-user-icon"></i>
                </button>
                <ul class="dropdown-menu dropdown-menu-end">
                    <li><a class="dropdown-item" href="#">Perfil</a></li>
                    <li><a class="dropdown-item" href="#">Cerrar Sesión</a></li>
                </ul>
            </div>
        </div>
    </div>
</nav>

<!-- BARRA DE PROCESOS -->
<div class="container-fluid custom-purple-bar mt-5">
    <div class="dropdown">
        <button class="custom-link-dropdown dropdown-toggle" type="button" data-bs-toggle="dropdown">
            <i class="bi bi-chevron-down-fill me-2"></i> Procesos
        </button>
        <ul class="dropdown-menu custom-dropdown-menu">
            <li><a class="dropdown-item active" href="#">Solicitar Justificante</a></li>
            <li><a class="dropdown-item" href="#">Actualizar Datos Justificante</a></li>
            <li><a class="dropdown-item" href="#">Cancelar Justificante</a></li>
            <li><a class="dropdown-item" href="#">Ver Justificantes Solicitados</a></li>
        </ul>
    </div>
</div>

<!-- BARRA ACTIVA DE OPCIÓN -->
<div class="row g-0">
    <div class="col-12 active-option-bar">
        Solicitar Justificante
    </div>
</div>

<!-- FORMULARIO DE SOLICITUD -->
<div class="container py-4">
    <div class="row">
        <div class="col-12">
            <div class="card shadow-sm p-3">
                <h5 class="mb-3">Detalles del Justificante</h5>
                <form>
                    <div class="row mb-3 align-items-center">
                        <label for="noControl" class="col-sm-3 col-form-label text-end form-label">No. Control:</label>
                        <div class="col-sm-9">
                            <input type="text" class="form-control" id="noControl" value="123456" readonly>
                        </div>
                    </div>

                    <div class="row mb-3 align-items-center">
                        <label for="cuatrimestre" class="col-sm-3 col-form-label text-end form-label">Cuatrimestre:</label>
                        <div class="col-sm-3">
                            <select class="form-select" id="cuatrimestre">
                                <option selected>ENERO-ABRIL</option>
                                <option>MAYO-AGOSTO</option>
                                <option>SEP-DIC</option>
                            </select>
                        </div>
                        <label for="grupo" class="col-sm-1 col-form-label text-end form-label">Grupo:</label>
                        <div class="col-sm-2">
                            <select class="form-select" id="grupo">
                                <option selected>GTI0131</option>
                                <option>GTI0132</option>
                            </select>
                        </div>
                        <label for="motivo" class="col-sm-1 col-form-label text-end form-label">Motivo:</label>
                        <div class="col-sm-2">
                            <select class="form-select" id="motivo">
                                <option selected>PERSONAL</option>
                                <option>MÉDICO</option>
                            </select>
                        </div>
                    </div>

                    <div class="row mb-3 align-items-center">
                        <label for="fechaInasistencia" class="col-sm-3 col-form-label text-end form-label">Fecha de Inasistencia:</label>
                        <div class="col-sm-3">
                            <input type="date" class="form-control" id="fechaInasistencia">
                        </div>
                        <label for="tutor" class="col-sm-1 col-form-label text-end form-label">Tutor:</label>
                        <div class="col-sm-5">
                            <input type="text" class="form-control" id="tutor" value="Prof. García">
                        </div>
                    </div>

                    <div class="row mb-3 align-items-center">
                        <label for="subirDocumento" class="col-sm-3 col-form-label text-end form-label">Subir Documento:</label>
                        <div class="col-sm-9">
                            <input type="file" class="form-control btn-select-file" id="subirDocumento" aria-describedby="fileHelp">
                            <small id="fileHelp" class="form-text text-muted">PDF, JPG, PNG</small>
                        </div>
                    </div>

                    <div class="d-flex justify-content-center pt-3">
                        <button type="submit" class="btn btn-submit me-3">Enviar</button>
                        <button type="reset" class="btn btn-clean">Limpiar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // Nombre de usuario dinámico
    const usernameFromSession = "Estudiante01";
    document.getElementById('userName').textContent = usernameFromSession;
</script>
</body>
</html>
