<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Justificantes - Home</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="home.css"> 
    <style>
        .role-button {
            height: 150px; 
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-size: 1.25rem;
            font-weight: 600;
            color: white;
            border: none;
            border-radius: 0.5rem;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .role-button:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
            color: white;
        }

        .role-icon {
            font-size: 3rem;
            margin-bottom: 0.5rem;
        }

        .btn-alumno {
            background-color: var(--utng-actualizar-btn); 
        }
        .btn-alumno:hover {
            background-color: #43a047;
        }

        .btn-asistente {
            background-color: var(--utng-download-btn); 
        }
        .btn-asistente:hover {
            background-color: #138496;
        }

        .btn-directora {
            background-color: var(--utng-dark-blue); 
        }
        .btn-directora:hover {
            background-color: #032a56;
        }

        .btn-tutor {
            background-color: var(--utng-purple); 
        }
        .btn-tutor:hover {
            background-color: #6a3abf;
        }

        .custom-main-content-home {
            margin-top: 60px; 
            height: calc(100vh - 60px); 
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark custom-navbar-bg fixed-top">
        <div class="container-fluid">
            <a class="navbar-brand me-4" href="home.html">
                <img src="/src/app/componentes/images/LogoUtng.png" alt="Logo Universidad" height="50">
            </a>

            <div class="d-flex flex-column text-white">
                <h1 class="fs-4 mb-0">SISTEMA DE JUSTIFICANTES</h1>
                <h2 class="fs-5 mb-0">- ÁREA TI</h2>
            </div>

            <div class="ms-auto d-flex align-items-center">
                <div class="dropdown">
                    <span class="text-white me-2">User Name</span>
                    
                    <button class="btn dropdown-toggle p-0" type="button" data-bs-toggle="dropdown" aria-expanded="false" id="userDropdown">
                        <i class="bi bi-person-circle fs-2 custom-user-icon"></i>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userDropdown">
                        <li><a class="dropdown-item" href="/src/app/componentes/perfil/vista-general/vista-general.html">Perfil</a></li>
                        <li><a class="dropdown-item" href="/src/app/componentes/inicio-sesion/inicio-sesion.html">Cerrar Sesión</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>
    
    <div class="container-fluid custom-main-content-home">
        <div class="row w-100 justify-content-center">
            
            <h3 class="text-center mb-5 text-muted">Selecciona tu Rol para Continuar</h3>

            <div class="col-12 col-md-6 col-lg-3 mb-4 d-flex justify-content-center">
                <a href="/src/app/componentes/alumno/menu-alumno/menu-alumno.html" class="role-button btn-alumno shadow">
                    <i class="bi bi-person-badge-fill role-icon"></i>
                    Alumno
                </a>
            </div>

            <div class="col-12 col-md-6 col-lg-3 mb-4 d-flex justify-content-center">
                <a href="/src/app/componentes/asistente/menu-asistente/menu-asistente.html" class="role-button btn-asistente shadow">
                    <i class="bi bi-person-workspace role-icon"></i>
                    Asistente
                </a>
            </div>

            <div class="col-12 col-md-6 col-lg-3 mb-4 d-flex justify-content-center">
                <a href="/src/app/componentes/directora/menu-directora/menu-directora.html" class="role-button btn-directora shadow">
                    <i class="bi bi-person-vcard-fill role-icon"></i>
                    Directora
                </a>
            </div>

            <div class="col-12 col-md-6 col-lg-3 mb-4 d-flex justify-content-center">
                <a href="/src/app/componentes/tutor/menu-tutor/menu-tutor.html" class="role-button btn-tutor shadow">
                    <i class="bi bi-person-check-fill role-icon"></i>
                    Tutor
                </a>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
