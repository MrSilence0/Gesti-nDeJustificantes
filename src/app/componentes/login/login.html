<div class="main-container">
<div class="card custom-card-registro shadow-lg p-4">
    <div class="card-body text-center">
        
        <div class="logo-container mb-4">
            <img src="/images/LogoUtng.png" alt="Logo UTNG" class="img-fluid custom-logo-full">
        </div>

        <div class="system-header-login p-2 mb-4">
            <h1 class="fs-4 mb-0 text-white">SISTEMA DE JUSTIFICANTES</h1>
            <h2 class="fs-5 mb-0 text-white">- ÁREA TI</h2>
        </div>
        
        <div id="errorMessage" class="alert alert-danger error-modal-style mb-4" role="alert" [class.d-none]="!showError">
            <i class="bi bi-exclamation-triangle-fill"></i> Por favor, revisa y llena todos los campos obligatorios.
        </div>

        <form #registroForm="ngForm" (ngSubmit)="onRegister(registroForm)">
            
            <div class="mb-3">
                <input type="text" class="form-control custom-input" id="noControl" name="noControl" [(ngModel)]="formData.noControl" placeholder="No. de Control o No. de Empleado" required>
            </div>
            
            <div class="mb-3">
                <input type="text" class="form-control custom-input" id="nombre" name="nombre" [(ngModel)]="formData.nombre" placeholder="Nombre(s)" required>
            </div>

            <div class="mb-3">
                <input type="text" class="form-control custom-input" id="apellidoPaterno" name="apellidoPaterno" [(ngModel)]="formData.apellidoPaterno" placeholder="Apellido Paterno" required>
            </div>

            <div class="mb-3">
                <input type="text" class="form-control custom-input" id="apellidoMaterno" name="apellidoMaterno" [(ngModel)]="formData.apellidoMaterno" placeholder="Apellido Materno" required>
            </div>
            
            <div class="mb-3">
                <input type="email" class="form-control custom-input" id="correo" name="correo" [(ngModel)]="formData.correo" placeholder="Correo electrónico" required>
            </div>

            <div class="mb-3">
                <input type="password" class="form-control custom-input" id="contrasena" name="contrasena" [(ngModel)]="formData.contrasena" placeholder="Contraseña" required>
            </div>

            <div class="mb-4">
                <input type="password" class="form-control custom-input" id="confirmarContrasena" name="confirmarContrasena" [(ngModel)]="formData.confirmarContrasena" placeholder="Confirmar Contraseña" required>
            </div>

            <div class="d-grid mb-4">
                <button type="submit" class="btn btn-lg custom-btn-register">Registrarse</button>
            </div>
        </form>

        <div class="text-center mt-4">
            <p class="mb-1"><a href="#" class="text-decoration-none small">Consulta nuestras Políticas de Privacidad</a></p>
            <small class="text-muted d-block small">Español - México (es_mx) | <a href="#" class="text-decoration-none">Aviso sobre cookies</a></small>
        </div>
    </div>
</div>
</div>
