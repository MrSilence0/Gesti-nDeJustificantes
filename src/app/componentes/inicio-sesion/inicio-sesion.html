<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro | Sistema de Justificantes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="inicio-sesion.css">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100">

    <div class="card custom-card-registro shadow-lg p-4">
        <div class="card-body text-center">
            
            <div class="logo-container mb-4">
                <img src="/src/app/componentes/images/LogoUtng.png" alt="Logo UTNG" class="img-fluid custom-logo-full">
            </div>

            <div class="system-header-login p-2 mb-4">
                <h1 class="fs-4 mb-0 text-white">SISTEMA DE JUSTIFICANTES</h1>
                <h2 class="fs-5 mb-0 text-white">- ÁREA TI</h2>
            </div>
            
            <div id="errorMessage" class="alert alert-danger error-modal-style d-none mb-4" role="alert">
                <i class="bi bi-exclamation-triangle-fill"></i> Por favor, revisa y llena todos los campos obligatorios.
            </div>

            <form id="registroForm">
                
                <div class="mb-3">
                    <input type="text" class="form-control custom-input" id="noControl" placeholder="No. de Control o No. de Empleado" required>
                </div>
                
                <div class="mb-3">
                    <input type="text" class="form-control custom-input" id="nombre" placeholder="Nombre(s)" required>
                </div>

                <div class="mb-3">
                    <input type="text" class="form-control custom-input" id="apellidoPaterno" placeholder="Apellido Paterno" required>
                </div>

                <div class="mb-3">
                    <input type="text" class="form-control custom-input" id="apellidoMaterno" placeholder="Apellido Materno" required>
                </div>
                
                <div class="mb-3">
                    <input type="email" class="form-control custom-input" id="correo" placeholder="Correo electrónico" required>
                </div>

                <div class="mb-3">
                    <input type="password" class="form-control custom-input" id="contrasena" placeholder="Contraseña" required>
                </div>

                <div class="mb-4">
                    <input type="password" class="form-control custom-input" id="confirmarContrasena" placeholder="Confirmar Contraseña" required>
                </div>

                <div class="d-grid mb-4">
                    <button type="submit" class="btn btn-lg custom-btn-register">Registrarme</button>
                </div>
            </form>

            <div class="text-center mt-4">
                <p class="mb-1"><a href="#" class="text-decoration-none small">Consulta nuestras Políticas de Privacidad</a></p>
                <small class="text-muted d-block small">Español - México (es_mx) | <a href="#" class="text-decoration-none">Aviso sobre cookies</a></small>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script>
        document.getElementById('registroForm').addEventListener('submit', function(event) {
            event.preventDefault();
            const form = event.target;
            let isValid = true;
            const errorMessage = document.getElementById('errorMessage');
            const inputs = form.querySelectorAll('.custom-input');

            // 1. Limpiar estilos de error anteriores
            inputs.forEach(input => {
                input.classList.remove('is-invalid');
            });

            // 2. Validar campos
            inputs.forEach(input => {
                if (input.value.trim() === '') {
                    input.classList.add('is-invalid');
                    isValid = false;
                }
            });
            
            // 3. Validar coincidencia de contraseñas si están llenas
            const contrasena = document.getElementById('contrasena');
            const confirmarContrasena = document.getElementById('confirmarContrasena');
            if (contrasena.value.trim() !== '' && confirmarContrasena.value.trim() !== '' && contrasena.value !== confirmarContrasena.value) {
                contrasena.classList.add('is-invalid');
                confirmarContrasena.classList.add('is-invalid');
                isValid = false;
            }

            // 4. Mostrar u ocultar mensaje de error
            if (!isValid) {
                errorMessage.classList.remove('d-none');
            } else {
                errorMessage.classList.add('d-none');
                // Aquí iría la lógica para enviar el formulario (AJAX o submit real)
                alert('¡Formulario válido! Enviando datos de registro...');
                // form.submit(); 
            }
        });
    </script>
</body>
</html>
